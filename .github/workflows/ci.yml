name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Unit tests & signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Validates the wrapper and caches Gradle dependencies + build caches
      # between runs, so each run no longer re-downloads everything.
      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Decode the stable upload key from secrets. Every build is signed with
      # the same key, so new versions update over installed ones without
      # requiring an uninstall.
      - name: Decode signing key
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload-key.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload-key.p12" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Run unit tests and build signed APK
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      # Tag pushes (v*) publish a GitHub Release with the APK attached,
      # built entirely on GitHub's runners.
      - name: Publish GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "PrevisorDatos_${VERSION}.apk"
          sha256sum "PrevisorDatos_${VERSION}.apk"
          gh release create "$GITHUB_REF_NAME" "PrevisorDatos_${VERSION}.apk" \
            --title "$GITHUB_REF_NAME – Previsor de Datos Móviles" \
            --generate-notes
